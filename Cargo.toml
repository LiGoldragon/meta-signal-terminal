[package]
name         = "meta-signal-terminal"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-terminal"
description  = "Meta Signal contract for privileged terminal session lifecycle."
publish      = false
links        = "meta-signal-terminal"
build        = "build.rs"

[lib]
name = "meta_signal_terminal"
path = "src/lib.rs"

[features]
default = ["nota-text"]
nota-text = [
    "dep:nota",
    "signal-frame/nota-text",
    "signal-terminal/nota-text",
]

[dependencies]
nota            = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main", optional = true }
rkyv            = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame    = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main", default-features = false }
signal-terminal = { git = "https://github.com/LiGoldragon/signal-terminal.git", rev = "2faad3a8787c962a5555aa2abf5e2721661e7925", default-features = false }
thiserror       = "2"

[build-dependencies]
schema      = { package = "schema", git = "https://github.com/LiGoldragon/schema.git", rev = "4a8aaf1de3aaf476577d5b4e93691ef47c135d1a" }
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "886a9009077bdf9ee0e71fa0fa31aaf6e5444dd3" }

[dev-dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
