[package]
name="meta-signal-terminal"
version="4.0.0"
edition="2024"
rust-version="1.89"
publish=false
build="build.rs"
[features]
default=[]
datom=["dep:datom-codec","dep:protos","signal-terminal/datom"]
[dependencies]
signal-terminal={git="https://github.com/LiGoldragon/signal-terminal.git",rev="a3e4f96bf2eb2095e377a73a31ee927ef3e6b44f",default-features=false}
datom-codec={git="https://github.com/LiGoldragon/datom-codec",rev="09e2a9d52bf7f2f11e51d15cb6c3177f72c6c927",optional=true}
protos={git="https://github.com/LiGoldragon/protos",rev="1febca7836bf8d5f5973a302fdd50aa9c84c159b",optional=true}
rkyv={version="0.8",default-features=false,features=["std","bytecheck","little_endian","pointer_width_32","unaligned"]}
[build-dependencies]
ethos-zero={git="https://github.com/LiGoldragon/ethos-zero",rev="4bf73cae8d4f5a2072c76a11cd2f00aa3fe9f8e3"}
