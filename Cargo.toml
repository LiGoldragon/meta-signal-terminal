[package]
name="meta-signal-terminal"
version="4.1.0"
edition="2024"
rust-version="1.89"
publish=false
build="build.rs"
[features]
default=[]
datom=["dep:datom-codec","dep:protos","signal-terminal/datom"]
[dependencies]
signal-terminal={git="https://github.com/LiGoldragon/signal-terminal.git",rev="428d663",default-features=false}
datom-codec={git="https://github.com/LiGoldragon/datom-codec",rev="eabead4",optional=true}
protos={git="https://github.com/LiGoldragon/protos",rev="3c7ade3",optional=true}
rkyv={version="0.8",default-features=false,features=["std","bytecheck","little_endian","pointer_width_32","unaligned"]}
[build-dependencies]
ethos-zero={git="https://github.com/LiGoldragon/ethos-zero",rev="5a5daca"}
